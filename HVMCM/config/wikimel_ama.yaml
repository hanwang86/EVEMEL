run_name: WikiMEL
seed: 43
pretrained_model: 'openai/clip-vit-base-patch32'
lr: 3e-5

data:
  num_entity: 109976
  kb_img_folder: /path/to/datasets/WikiMEL/kb_image
  mention_img_folder: /path/to/datasets/WikiMEL/mention_image/mention_image
  qid2id: /path/to/datasets/WikiMEL/qid2id.json
  entity: /path/to/datasets/WikiMEL/kb_entity_desc.json

  train_file: /path/to/ama_outputs/WikiMEL/Execution/WIKIMEL_train_with_tools.json
  dev_file: /path/to/ama_outputs/WikiMEL/Execution/WIKIMEL_dev_with_tools.json
  test_file: /path/to/ama_outputs/WikiMEL/Execution/WIKIMEL_test_with_tools.json
  grounded_img_folder: /path/to/ama_outputs/WikiMEL/Execution/grounded_images
  test_ckpt: null
  hard_neg_file:  /path/to/hard_negatives/wikimel_hard_negatives.json

  num_hard_negatives: 3

  batch_size: 128
  num_workers: 8
  text_max_length: 60

  eval_chunk_size: 6000
  eval_batch_size: 20
  embed_update_batch_size: 512


model:
  input_hidden_dim: 512
  input_image_hidden_dim: 768
  hidden_dim: 96
  dv: 96
  dt: 512
  TGLU_hidden_dim: 96
  IDLU_hidden_dim: 96
  CMFU_hidden_dim: 96
  loss_temperature: 0.03
  inter_weight: 1.0
  intra_weight: 0.8
  with_cl_loss: 1

rq3:
  every_n_train_steps: 100


trainer:
  accelerator: 'gpu'
  devices: [2]
  precision: 16
  max_epochs: 20
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 2
  log_every_n_steps: 30
